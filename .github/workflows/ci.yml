name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @wati-io/chat-sdk-adapter
      - name: Check the npm tarball holds only dist, package.json, README, LICENSE and CHANGELOG
        working-directory: adapter
        run: |
          set -euo pipefail
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e '
            const [pkg] = require(process.argv[1]);
            const allowed = (p) => p.startsWith("dist/") || ["package.json", "README.md", "LICENSE", "CHANGELOG.md"].includes(p);
            const extra = pkg.files.map((f) => f.path).filter((p) => !allowed(p));
            if (extra.length) { console.error("Unexpected files in tarball:", extra); process.exit(1); }
            console.log(pkg.files.map((f) => f.path).join("\n"));
          ' "$RUNNER_TEMP/pack.json"

  example:
    name: Example app (uses the published package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: example/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
